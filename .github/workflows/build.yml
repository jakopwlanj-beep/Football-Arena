name: Build Football Arena APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential \
            ccache libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install buildozer cython==0.29.34
          cython --version

      - name: Extract game
        run: |
          mkdir -p build
          unzip -q Football_Arena_APK_fix_v2.zip -d build
          mv "build/Football Arena" build/Football_Arena

      - name: Fix Android API
        run: |
          sed -i 's/^android.minapi *= *.*/android.minapi = 24/' build/Football_Arena/buildozer.spec
          grep 'android.minapi' build/Football_Arena/buildozer.spec

      - name: Build APK
        working-directory: build/Football_Arena
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Arena-APK
          path: build/Football_Arena/bin/*.apk
